# MongoDB Headless Service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: chat-app
  labels:
    app: mongodb
spec:
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  clusterIP: None
  selector:
    app: mongodb
---
# MongoDB Service for external access within cluster
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: chat-app
  labels:
    app: mongodb
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb
  type: ClusterIP
---
# MongoDB StatefulSet with Replica Set
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: chat-app
spec:
  serviceName: mongodb-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: chatapp
        command:
        - mongod
        - "--replSet"
        - "rs0"
        - "--bind_ip_all"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
# ConfigMap for MongoDB replica set initialization script
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
  namespace: chat-app
data:
  init-replica.sh: |
    #!/bin/bash
    echo "Waiting for MongoDB pods to be ready..."
    sleep 30
    
    # Check if replica set is already initialized
    mongosh --host mongodb-0.mongodb-headless.chat-app.svc.cluster.local --eval "rs.status()" 2>/dev/null
    if [ $? -eq 0 ]; then
      echo "Replica set already initialized"
      exit 0
    fi
    
    echo "Initializing replica set..."
    mongosh --host mongodb-0.mongodb-headless.chat-app.svc.cluster.local <<EOF
    rs.initiate({
      _id: "rs0",
      members: [
        { _id: 0, host: "mongodb-0.mongodb-headless.chat-app.svc.cluster.local:27017", priority: 2 },
        { _id: 1, host: "mongodb-1.mongodb-headless.chat-app.svc.cluster.local:27017", priority: 1 },
        { _id: 2, host: "mongodb-2.mongodb-headless.chat-app.svc.cluster.local:27017", priority: 1 }
      ]
    });
    EOF
    
    echo "Waiting for replica set to stabilize..."
    sleep 10
    
    mongosh --host mongodb-0.mongodb-headless.chat-app.svc.cluster.local --eval "rs.status()"
    echo "Replica set initialization complete!"
---
# Job to initialize MongoDB Replica Set
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-replica
  namespace: chat-app
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-replica
        image: mongo:7.0
        command: ["/bin/bash", "/scripts/init-replica.sh"]
        volumeMounts:
        - name: init-script
          mountPath: /scripts
      volumes:
      - name: init-script
        configMap:
          name: mongodb-init-script
          defaultMode: 0755
