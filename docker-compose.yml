version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: chat-app-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chatapp
    networks:
      - chat-app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-app-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_DB_URI=mongodb://mongodb:27017/chatapp
      - JWT_SECRET=@@@###$$$kkk<>***@@@###@@@111
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - chat-app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-app-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chat-app-network

volumes:
  mongodb_data:
    driver: local

networks:
  chat-app-network:
    driver: bridge
